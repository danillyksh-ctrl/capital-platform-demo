services:
    app:
        build: .
        ports:
            - "127.0.0.1:8000:8000"
        env_file: .env
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - app-storage:/app/storage
        restart: unless-stopped
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-capital}
            POSTGRES_USER: ${DB_USERNAME:-capital}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 15
    redis:
        image: redis:7-alpine
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
    mailpit:
        image: axllent/mailpit:v1.27
        ports:
            - "127.0.0.1:8025:8025"
volumes:
    postgres-data:
    app-storage:
